# 应用服务器配置
server.port=8080
server.servlet.context-path=/api

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bishe?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.pethealth.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Actuator 配置
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# 应用信息配置
info.app.name=宠物健康管理系统
info.app.version=1.0.0
info.app.description=基于Spring Boot的宠物健康管理系统后端API

# 统一日志级别配置
logging.level.com.pethealth=DEBUG
logging.level.com.pethealth.aspect.LogAspect=INFO
logging.level.com.pethealth.controller=DEBUG
logging.level.com.pethealth.service=DEBUG

# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# JWT 配置（通过环境变量注入）
jwt.secret=${JWT_SECRET:pethealth-secret-key-2026-02-10-keep-it-safe}
jwt.expiration=${JWT_EXPIRATION:86400} # 24小时（单位：秒）
