# 应用服务器配置
server.port=8080
server.servlet.context-path=/api

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bishe?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.pethealth.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# JWT 配置
jwt.secret=pethealth-secret-key-2026-02-10-keep-it-safe-and-secure-32-chars-minimum
jwt.expiration=86400

# 日志配置
logging.level.com.pethealth=DEBUG
logging.level.com.pethealth.interceptor=DEBUG

# 完全禁用Security相关自动配置
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# 微信配置
wechat.appid=your-wechat-appid
wechat.secret=your-wechat-secret
wechat.template.upcoming-reminder=your-upcoming-template-id
wechat.template.overdue-reminder=your-overdue-template-id
wechat.template.completion-confirmation=your-completion-template-id

# 文件上传配置
file.upload.path=${user.home}/pethealth/uploads
file.upload.max-size=10485760
file.upload.allowed-types=image/jpeg,image/png,image/gif,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Spring Boot Multipart配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}
